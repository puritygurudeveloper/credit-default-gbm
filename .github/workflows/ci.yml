name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,explain]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Fast tests
        run: pytest -m "not slow" --cov --cov-report=term-missing
      - name: Full suite including model fits
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  model-validation:
    # The gate that matters: a merge may not silently degrade the model or
    # break the economic conclusion the credit policy rests on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Out-of-time validation run
        run: python -m creditrisk.cli run --rows 60000 --json artifacts/leaderboard.json
      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard
          path: artifacts/leaderboard.json
