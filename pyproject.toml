[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditrisk"
version = "0.4.0"
description = "Cost-sensitive consumer credit default modelling: scorecard versus gradient boosting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Purity Muthoni Ngige" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
]

[project.optional-dependencies]
explain = ["shap>=0.44"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
creditrisk = "creditrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: fits a model; excluded from the fast pre-commit loop via -m 'not slow'",
]

[tool.coverage.run]
source = ["src/creditrisk"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
